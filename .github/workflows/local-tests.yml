name: Local Python tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pandas numpy scipy scikit-learn requests requests-toolbelt python-dotenv pyyaml pydantic joblib
      - run: python -m pytest tests -q
